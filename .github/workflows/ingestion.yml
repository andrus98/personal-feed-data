name: Ingestion RSS

# L'ingestion vive qui, nel repo dei dati, e non piu' in personal-feed. Due
# ragioni, in ordine di peso.
#
# 1. Scrivere nel proprio repository si fa con il GITHUB_TOKEN del run: sparisce
#    la deploy key SSH, che era il pezzo con piu' modi di rompersi e l'unico
#    segreto di lunga durata dell'impianto.
# 2. In personal-feed il workflow e' stato spento da GitHub il 27/10/2026 dopo
#    60 giorni senza push: il codice e' finito e nessuno ci scrive piu'. Qui
#    invece arriva un commit a ogni run.
#
# Attenzione pero': non e' dimostrato che i commit del bot contino come
# "attivita' del repository" per quella regola. Il Worker che fa da sveglia
# lanciava dispatch ogni 20 minuti e quelli non sono bastati. La garanzia vera
# sta nel Worker, che se trova il workflow disabilitato lo riaccende e ritenta.

on:
  schedule:
    # Tre volte l'ora, lontano dagli scatti tondi dove si accalcano tutti.
    # E' la seconda gamba: la prima e' il Worker Cloudflare, che chiama
    # workflow_dispatch ai minuti :00, :20 e :40. Se una delle due salta,
    # l'altra copre; `concurrency` impedisce che si pestino i piedi.
    - cron: "7,27,47 * * * *"
  workflow_dispatch:

# Il token serve a committare in questo stesso repo, e a nient'altro.
permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Entrambi i checkout stanno in una sottocartella: cosi' nessuno dei due
      # finisce dentro l'albero di lavoro dell'altro, e il `git add -A` del
      # commit non puo' inghiottire il codice o la cache.
      - name: Checkout del repo dati
        uses: actions/checkout@v4
        with:
          path: data-repo

      - name: Checkout del codice
        uses: actions/checkout@v4
        with:
          repository: andrus98/personal-feed
          path: code
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/ingest/requirements.txt

      - name: Dipendenze
        run: pip install -r code/ingest/requirements.txt

      # Gli ETag dei feed. ingest.py li scrive accanto al codice, cioe' in
      # code/.cache, fuori dal repo dati: sono metadati effimeri e committarli
      # a ogni run sarebbe churn puro. Se la cache si perde, il run successivo
      # riscarica tutto e la ricostruisce.
      - name: Cache dei validatori HTTP
        uses: actions/cache@v4
        with:
          path: code/.cache
          key: http-cache-${{ github.run_id }}
          restore-keys: http-cache-

      # Prima di scrivere: se la normalizzazione e' rotta, meglio un run fallito
      # che uno shard di articoli sbagliati committato per sempre.
      - name: Selftest
        run: python code/ingest/selftest.py

      - name: Ingestion
        run: python code/ingest/ingest.py --data-dir data-repo

      - name: Commit e push
        working-directory: data-repo
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nessun articolo nuovo: niente da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ingestion $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
